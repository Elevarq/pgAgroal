name: Bug
description: Report a problem with the pgagroal container or Helm chart.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: Concrete observed behaviour.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Minimal steps so anyone can hit the same bug.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Fill in what applies.
      value: |
        - Project (image) version: (e.g. 1.1.0)
        - pgagroal version: (e.g. 2.1.0)
        - Deployment: Docker / Helm / docker-compose
        - Kubernetes version (if applicable):
        - Platform: (e.g. EKS, local Docker Desktop)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant container/pod logs.
      render: shell
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "Critical — production-down / data loss"
        - "High — feature broken in a release"
        - "Medium — broken on main, workaround exists"
        - "Low — cosmetic"
    validations:
      required: true

  - type: dropdown
    id: effort
    attributes:
      label: Effort (T-shirt size)
      options:
        - "XS"
        - "S"
        - "M"
        - "L"
        - "XL"
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - "P0 — Must-have"
        - "P1 — Should-have"
        - "P2 — Nice-to-have"
        - "P3 — Backlog"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        After creating this issue, apply the matching labels:
        `effort:XS`/`effort:S`/`effort:M`/`effort:L`/`effort:XL` and
        `priority:P0`/`priority:P1`/`priority:P2`/`priority:P3`.
