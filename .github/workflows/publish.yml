---
name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create GitHub Release
  id-token: write   # OIDC token for Sigstore signing + provenance
  packages: write   # push image to GHCR (ghcr.io/elevarq/pgagroal)

jobs:
  # ── Gate A.1 + F — tag/VERSION consistency, changelog present ─────────
  validate:
    name: Validate Release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Tag matches VERSION and Chart.yaml
        run: |
          file_version=$(tr -d '[:space:]' < VERSION)
          chart_version=$(sed -n 's/^version: //p' helm/pgagroal/Chart.yaml | tr -d '[:space:]')
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "${file_version}" != "${tag_version}" ]]; then
            echo "STOP: tag ${GITHUB_REF_NAME} does not match VERSION file (${file_version})" >&2
            exit 1
          fi
          if [[ "${chart_version}" != "${tag_version}" ]]; then
            echo "STOP: tag ${GITHUB_REF_NAME} does not match Chart.yaml version (${chart_version})" >&2
            exit 1
          fi
          echo "Version consistent: ${tag_version}"

      - name: Changelog entry exists
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "STOP: CHANGELOG.md has no '## [${version}]' section" >&2
            exit 1
          fi
          echo "Changelog entry present"

  # ── Gate A.2 — test against the built artifact ────────────────────────
  test:
    name: Test Artifact
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: pgagroal:${{ needs.validate.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Retag for Makefile (IMAGE_TAG)
        run: docker tag pgagroal:${{ needs.validate.outputs.version }} pgagroal:test

      - name: Integration test
        run: bash test/integration/container-start-test.sh

      - name: Backend restart resilience test
        run: bash test/resilience/backend-restart-test.sh

      - name: Docker restart resilience test
        run: bash test/resilience/docker-restart-test.sh

      - name: Startup failure test
        run: bash test/resilience/startup-failure-test.sh

  # ── Gate C — security scans against the release commit + image ────────
  security:
    name: Security Scan
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # gitleaks needs full history

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: pgagroal:scan
          cache-from: type=gha

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: pgagroal:scan
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Gitleaks secret scan
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1

  # ── Gate D + E — multi-arch build, push, sign, attest ─────────────────
  publish:
    name: Build and Publish
    needs: [validate, test, security]
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            elevarq/pgagroal
            ghcr.io/elevarq/pgagroal
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign published images
        run: |
          digest="${{ steps.build.outputs.digest }}"
          tags="${{ steps.meta.outputs.tags }}"
          echo "$tags" | while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Signing ${tag}@${digest}"
            cosign sign --yes "${tag}@${digest}"
          done

  # ── Gate E (chart) — publish Helm chart as an OCI artifact ────────────
  # Parity with the container image: the chart is pushed to GHCR as an
  # OCI artifact so it installs by reference without a repo checkout:
  #   helm install pgagroal oci://ghcr.io/elevarq/charts/pgagroal \
  #     --version <X.Y.Z>
  # The chart version is stamped from the release tag at package time;
  # the validate job already enforces Chart.yaml == tag, so the two
  # always agree. See #40.
  publish-chart:
    name: Publish Helm chart (OCI)
    needs: [validate, publish]
    runs-on: ubuntu-24.04
    env:
      CHART_REGISTRY: oci://ghcr.io/elevarq/charts
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - name: Lint chart
        run: helm lint helm/pgagroal

      # cosign reads ~/.docker/config.json; `helm registry login` writes
      # Helm's own store, so cosign needs a separate docker login to push
      # the chart signature to GHCR (parity with the image job).
      - name: Log in to GHCR (docker, for cosign)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR (helm registry)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package chart (version stamped from tag)
        id: package
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          helm package helm/pgagroal \
            --version "${VERSION}" \
            --app-version "${VERSION}" \
            --destination dist-chart
          echo "file=dist-chart/pgagroal-${VERSION}.tgz" >> "$GITHUB_OUTPUT"

      - name: Push chart to GHCR
        id: push
        run: |
          # `helm push` prints the pushed digest to stderr; capture the
          # whole stream so the cosign step can sign the exact digest.
          helm push "${{ steps.package.outputs.file }}" "${CHART_REGISTRY}" 2>&1 | tee push.log
          DIGEST="$(grep -oE 'sha256:[0-9a-f]{64}' push.log | head -1)"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      # Keyless signing, same trust root as the container image: the
      # signature binds back to this workflow's GitHub OIDC identity.
      - name: Sign chart (cosign keyless)
        run: |
          cosign sign --yes \
            "ghcr.io/elevarq/charts/pgagroal@${{ steps.push.outputs.digest }}"

  # ── Gate F — GitHub Release with extracted changelog + supply chain ───
  release:
    name: GitHub Release
    needs: [validate, publish]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build release notes
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          awk -v v="${VERSION}" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "Release ${VERSION}" > release-notes.md
          fi

          cat >> release-notes.md <<EOF

          ---

          ## Supply chain

          - Image (Docker Hub): \`docker.io/elevarq/pgagroal:${VERSION}\`
          - Image (GHCR): \`ghcr.io/elevarq/pgagroal:${VERSION}\`
          - Digest: \`${DIGEST}\`
          - Architectures: linux/amd64, linux/arm64
          - Signed with [cosign](https://github.com/sigstore/cosign) (keyless, GitHub OIDC)
          - SBOM and SLSA provenance attached as OCI attestations

          Verify signature and attestations:

          \`\`\`bash
          IMAGE=docker.io/elevarq/pgagroal:${VERSION}   # or ghcr.io/elevarq/pgagroal:${VERSION}

          cosign verify "\$IMAGE" \\
            --certificate-identity-regexp='https://github.com/Elevarq/' \\
            --certificate-oidc-issuer='https://token.actions.githubusercontent.com'

          cosign verify-attestation --type spdxjson      "\$IMAGE"   # SBOM
          cosign verify-attestation --type slsaprovenance "\$IMAGE"   # provenance
          \`\`\`

          Full verification guide:
          https://github.com/Elevarq/pgAgroal/blob/main/docs/security/supply-chain-and-release-security.md
          EOF

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          generate_release_notes: false
          fail_on_unmatched_files: false
