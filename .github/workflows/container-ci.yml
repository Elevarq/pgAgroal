name: Container CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile with hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: ShellCheck entrypoint.sh
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .
          additional_files: entrypoint.sh

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.2

      - name: Helm lint
        run: helm lint helm/pgagroal/

      - name: Helm template (dry-run render)
        run: |
          helm template test-release helm/pgagroal/ \
            --set credentials.username=testuser \
            --set credentials.password=testpass \
            --set postgresql.host=pg-host

  build:
    name: Build Image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pgagroal:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    name: Trivy Security Scan
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build image for scanning
        run: docker build -t pgagroal:ci .

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'image'
          image-ref: 'pgagroal:ci'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  integration-test:
    name: Integration Test
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t pgagroal:2.0.2 .

      - name: Run integration test
        run: bash test/integration/container-start-test.sh

  resilience-test:
    name: Backend Restart Resilience
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t pgagroal:2.0.2 .

      - name: Run backend restart test
        run: bash test/resilience/backend-restart-test.sh

  startup-failure-test:
    name: Startup Failure Mode
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t pgagroal:test .

      - name: Run startup failure test
        run: bash test/resilience/startup-failure-test.sh
