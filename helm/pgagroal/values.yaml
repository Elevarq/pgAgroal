# -- Number of pgagroal replicas
replicaCount: 2

image:
  # -- Container image repository
  repository: ghcr.io/elevarq/pgagroal
  # -- Image tag. Empty defaults to the chart version (the tag the release
  # workflow publishes the image under). Override to pin a different tag.
  tag: ""
  # -- Image pull policy
  pullPolicy: IfNotPresent

# -- Pull secrets for private registries
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # -- Create a dedicated ServiceAccount
  create: true
  # -- Annotations for the ServiceAccount (e.g. IRSA)
  annotations: {}
  # -- Override ServiceAccount name
  name: ""

# -- Annotations added to every pod
podAnnotations: {}

# -- Labels added to every pod
podLabels: {}

# ---------------------------------------------------------------------------
# pgagroal configuration (passed as env vars to the entrypoint)
# ---------------------------------------------------------------------------
pgagroal:
  # -- Bind address inside the container. Left as "*" deliberately: the pooler
  # must bind the pod IP to be reachable via the Service, and a single value
  # cannot predict the pod IP. Exposure is constrained at two other layers
  # instead — the HBA source-CIDR allowlist (`hbaSource`) and the
  # NetworkPolicy (enabled by default) — not by narrowing this bind.
  host: "*"
  # -- Bind port
  port: 6432
  # -- Maximum pooled connections
  maxConnections: 100
  # -- Log level: fatal, error, warn, info, debug1-debug5, trace
  logLevel: info
  # -- HBA source-address allowlist (comma-separated CIDRs). Restricts which
  # source addresses the pooler accepts at the HBA layer. Default = RFC1918
  # private ranges, so an accidentally-exposed pooler rejects public sources.
  # pgagroal matches CIDRs on octet boundaries only (/8, /16, /24 — NOT /12),
  # so 172.16.0.0/12 is expanded into its sixteen /16 blocks. The generated
  # host lines use auth method scram-sha-256 (never trust/all). Set to "all"
  # to accept any source address (legacy), or tighten to your client
  # pod-network CIDR. If your pod network is outside RFC1918 (e.g. EKS
  # 100.64.0.0/10 secondary CIDR), set this to that CIDR. The default-on
  # NetworkPolicy is the second layer that backs the `host: "*"` bind.
  hbaSource: "10.0.0.0/8,172.16.0.0/16,172.17.0.0/16,172.18.0.0/16,172.19.0.0/16,172.20.0.0/16,172.21.0.0/16,172.22.0.0/16,172.23.0.0/16,172.24.0.0/16,172.25.0.0/16,172.26.0.0/16,172.27.0.0/16,172.28.0.0/16,172.29.0.0/16,172.30.0.0/16,172.31.0.0/16,192.168.0.0/16"
  # -- Pass unknown users through to the backend for authentication
  # (transparent pooling). HARDENED DEFAULT: false — unknown users are NOT
  # forwarded; every user must be pre-registered with pgagroal. Set true to
  # restore transparent pooling where the backend is the sole auth gate.
  allowUnknownUsers: false

# ---------------------------------------------------------------------------
# PostgreSQL backend
# ---------------------------------------------------------------------------
postgresql:
  # -- Backend host (usually a K8s Service name)
  host: "postgres"
  # -- Backend port
  port: 5432

# ---------------------------------------------------------------------------
# Credentials. The chart contains no credential values and creates no Secret.
# You reference an existing Kubernetes Secret (credentials.existingSecret)
# that you populate with your own PostgreSQL credentials (keys PG_USERNAME and
# PG_PASSWORD) before installing; the rendered manifests contain only a
# secretKeyRef, and the pod stays pending until that Secret exists.
# ---------------------------------------------------------------------------
credentials:
  # -- Name of an existing Kubernetes Secret holding your PostgreSQL
  # credentials under keys PG_USERNAME and PG_PASSWORD. You create this Secret
  # from your own existing credentials before installing (see README). The
  # chart contains no credential values of any kind and never creates a
  # Secret; it only references the one you provide.
  existingSecret: "pgagroal-pg-credentials"

# ---------------------------------------------------------------------------
# Frontend TLS (client <-> pooler). Off by default. When enabled, reference an
# existing Secret containing tls.crt + tls.key (and ca.crt for mutual TLS); the
# entrypoint installs the key at mode 0600 as pgagroal requires. TLS uses the
# existing pooler port (no new port). Backend TLS (pooler -> PostgreSQL) is not
# configured here (upstream marks it experimental and it disables pooling).
# ---------------------------------------------------------------------------
tls:
  # -- Enable frontend TLS.
  enabled: false
  # -- Name of an existing Secret with keys tls.crt and tls.key (and ca.crt when
  # mutualTLS is true). Create it from your own certificate before installing.
  existingSecret: "pgagroal-tls"
  # -- Require client certificates (mutual TLS); needs ca.crt in the Secret.
  # pgagroal requires and verifies the client cert against the CA (verify-ca).
  mutualTLS: false
  # -- Client-certificate verification mode. Only `verify-ca` is supported: the
  # pgagroal 2.1.0 pooler has no tls_cert_auth_mode key, so verify-full / CN-SAN
  # matching is not available.
  certAuthMode: verify-ca

# ---------------------------------------------------------------------------
# Kubernetes Service
# ---------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 6432

# ---------------------------------------------------------------------------
# NetworkPolicy (#49). A pooler fronting Postgres is a high-value
# lateral-movement target; restricting ingress to the pods that need the
# pooler — and egress to just the backend + DNS — limits blast radius.
#
# ENABLED BY DEFAULT (hardened default). The default render denies ingress
# from OUTSIDE the release namespace and allows same-namespace pods to reach
# the pooler, so it is reachable in-namespace without extra configuration.
# Disable with `enabled: false` on clusters whose CNI does not enforce
# NetworkPolicy (where the manifest would be a silent no-op).
# ---------------------------------------------------------------------------
networkPolicy:
  # -- Render the NetworkPolicy. Enabled by default for defence in depth.
  enabled: true
  # -- Allow all pods in the SAME namespace to reach the pooler (and metrics)
  # port. On by default so the pooler is reachable in-namespace while
  # cross-namespace ingress is denied. Set false to deny same-namespace
  # traffic too and admit ONLY the selectors below.
  allowSameNamespace: true
  # -- Additional pods allowed to reach the pooler, narrowing beyond
  # same-namespace. Each entry is a label map, e.g.:
  #   - app.kubernetes.io/name: my-app
  ingressPodSelectors: []
  # -- Namespaces allowed to reach the pooler, in addition to same-namespace
  # and the pod selectors. Each entry is a label map matched against namespace
  # labels.
  ingressNamespaceSelectors: []
  # -- Contain EGRESS in addition to ingress. Default OFF: the policy governs
  # ingress only (the pre-auth reachability control), leaving egress
  # unconstrained so DNS resolution and backend connectivity work on ANY
  # cluster. Declaring policyTypes:[Egress] denies all unlisted egress, and a
  # pinned kubeDNS CIDR breaks DNS where the cluster resolver differs (EKS
  # CoreDNS is 10.100.0.10, not 10.96.0.10). Set true ONLY together with the
  # correct kubeDNS below to contain egress in production.
  restrictEgress: false
  egress:
    # -- (restrictEgress only) Backend Postgres CIDR(s) the pooler must reach
    # (e.g. an RDS /32, or the pod-network CIDR for an in-cluster Postgres).
    # If empty, egress to the backend port is allowed to 0.0.0.0/0
    # (port-restricted) so the opt-in policy does not break backend
    # connectivity — tighten this to your backend CIDR.
    backendCIDRs: []
    # -- (restrictEgress only) Kube-DNS resolver CIDR(s). MUST match your
    # cluster or DNS breaks: EKS = 10.100.0.10/32, kubeadm default =
    # 10.96.0.10/32. Only applied when restrictEgress=true.
    kubeDNS:
      - "10.96.0.10/32"

# ---------------------------------------------------------------------------
# Probes
# ---------------------------------------------------------------------------
livenessProbe:
  exec:
    command:
      - pgagroal-cli
      - "-c"
      - /etc/pgagroal/pgagroal.conf
      - ping
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  exec:
    command:
      - pgagroal-cli
      - "-c"
      - /etc/pgagroal/pgagroal.conf
      - ping
  initialDelaySeconds: 3
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 2

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: "1"
    memory: 256Mi

# ---------------------------------------------------------------------------
# Pod disruption budget
# ---------------------------------------------------------------------------
podDisruptionBudget:
  enabled: true
  # -- Minimum available replicas during voluntary disruption
  minAvailable: 1
  # -- How the PDB treats not-yet-healthy pods during eviction.
  # AlwaysAllow lets unhealthy pods be evicted during disruptions so a stuck
  # pod can never block node drains. Set to "" to omit the field (defaults to
  # IfHealthyBudget on the API server). Requires Kubernetes >= 1.27 (GA 1.27).
  unhealthyPodEvictionPolicy: AlwaysAllow

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# ---------------------------------------------------------------------------
# Scheduling
# ---------------------------------------------------------------------------
nodeSelector: {}
tolerations: []
# -- Full control over pod affinity. When set (non-empty), this takes
# precedence over podAntiAffinity below and is used verbatim.
affinity: {}

# -- Spread replicas across nodes. With replicaCount > 1, co-locating all
# replicas on one node defeats the availability the PDB protects. When
# `affinity` above is empty, a default anti-affinity is rendered from this
# block. Disable with enabled: false, or use a hard constraint with
# type: hard (avoid on single-node clusters — it will leave replicas Pending).
podAntiAffinity:
  enabled: true
  # soft = preferredDuringScheduling (best-effort); hard = requiredDuringScheduling
  type: soft
  topologyKey: kubernetes.io/hostname

# ---------------------------------------------------------------------------
# Metrics (Prometheus)
# ---------------------------------------------------------------------------
metrics:
  # -- Enable the Prometheus metrics port (pgagroal built-in)
  enabled: false
  # -- Metrics port
  port: 9187

# ---------------------------------------------------------------------------
# Observability sidecar (future Elevarq collector / custom exporter)
# ---------------------------------------------------------------------------
observability:
  sidecar:
    # -- Enable the observability sidecar container
    enabled: false
    # -- Sidecar container image
    image: ""
    # -- Sidecar image tag
    tag: ""
    # -- Sidecar image pull policy
    pullPolicy: IfNotPresent
    # -- Sidecar container port (e.g. for a /metrics endpoint)
    port: 9188
    # -- Sidecar resource requests/limits
    resources: {}
    # -- Extra environment variables for the sidecar
    env: []
    # -- Extra volume mounts for the sidecar (e.g. shared /tmp for unix socket)
    extraVolumeMounts: []

# ---------------------------------------------------------------------------
# pgexporter (optional PostgreSQL metrics exporter — the server-metrics path)
# ---------------------------------------------------------------------------
# pgexporter connects DIRECTLY to PostgreSQL (never through pgagroal) with a
# least-privilege pg_monitor role, so the pooler's own connection statistics
# are not polluted by the exporter's scrape connections. Shipped as a SEPARATE
# component/image (one process per container), off by default — this mirrors
# the docker-compose integration stack.
#
# Enable example (create the credentials Secret first — see
# pgexporter.credentials.existingSecret below):
#   pgexporter:
#     enabled: true
#
# Provision the monitoring role first (see postgres-init/01-pgexporter-role.sh):
#   CREATE ROLE pgexporter WITH LOGIN PASSWORD '<password>'; GRANT pg_monitor TO pgexporter;
pgexporter:
  # -- Render the pgexporter Deployment, Service and NetworkPolicy
  enabled: false
  image:
    # -- pgexporter image repository (pin to a released version; never :latest)
    repository: ghcr.io/elevarq/pgexporter
    # -- pgexporter image tag (pinned upstream pgexporter release)
    tag: "0.8.0"
    # -- Image pull policy
    pullPolicy: IfNotPresent
  # -- Replicas (a single exporter is normally sufficient; scrapes are
  # idempotent reads, so there is no leader election)
  replicaCount: 1
  # -- Metrics port (the Prometheus scrape target)
  metricsPort: 5002
  # -- Log level: fatal, error, warn, info, debug1-debug5, trace
  logLevel: info
  # Monitoring role pgexporter authenticates to PostgreSQL with. Use a
  # pg_monitor role, NEVER a superuser.
  credentials:
    # -- Name of an existing Kubernetes Secret holding the monitoring-role
    # credentials under keys PGEXPORTER_USER and PGEXPORTER_PASSWORD. You
    # create this Secret from your own credentials before enabling the
    # exporter (see README). The chart contains no credential values of any
    # kind and never creates a Secret; it only references the one you provide.
    existingSecret: "pgagroal-pgexporter-credentials"
  service:
    # -- Service type (keep ClusterIP — the exporter is an internal scrape target)
    type: ClusterIP
    # -- Service port. Exposes ONLY metrics; pgexporter has no TCP management
    # port (management uses a unix socket), so nothing else is reachable.
    port: 5002
  # NetworkPolicy governing who can reach the metrics port. Since pgexporter
  # exposes no TCP management port, only metrics ingress needs governing.
  networkPolicy:
    # -- Render the NetworkPolicy (defence in depth; a no-op on CNIs that do
    # not enforce NetworkPolicy)
    enabled: true
    # -- Allow all pods in the SAME namespace to scrape. On by default so an
    # in-namespace Prometheus works; cross-namespace ingress is denied unless
    # admitted by a selector below.
    allowSameNamespace: true
    # -- Additional pods allowed to scrape (each entry a label map)
    ingressPodSelectors: []
    # -- Namespaces allowed to scrape (each entry a label map matched against
    # namespace labels) — e.g. your monitoring namespace
    ingressNamespaceSelectors: []
  # -- Resource requests/limits
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi
