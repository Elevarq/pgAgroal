{{- if and .Values.credentials.create (not .Values.credentials.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pgagroal.fullname" . }}
  labels:
    {{- include "pgagroal.labels" . | nindent 4 }}
type: Opaque
data:
  PG_USERNAME: {{ .Values.credentials.username | b64enc | quote }}
  PG_PASSWORD: {{ .Values.credentials.password | b64enc | quote }}
{{- end }}
