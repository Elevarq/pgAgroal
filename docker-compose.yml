services:
  postgres:
    image: postgres:17.4-bookworm
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: testdb
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Creates the least-privilege pgexporter monitoring role (pg_monitor).
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - pgagroal-net

  # Connection pooling layer — the client data path.
  # Also exposes its own native Prometheus metrics endpoint (pooler metrics).
  pgagroal:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_BACKEND_HOST: postgres
      PG_BACKEND_PORT: "5432"
      PGAGROAL_HOST: "*"
      PGAGROAL_PORT: "6432"
      PGAGROAL_METRICS_PORT: "2346"
      MAX_CONNECTIONS: "100"
      PGAGROAL_LOG_LEVEL: info
    ports:
      - "6432:6432"   # pooler (client data path)
      - "2346:2346"   # pgagroal native metrics (pooler metrics)
    networks:
      - pgagroal-net

  # PostgreSQL metrics exporter — the server-metrics path.
  # Connects DIRECTLY to postgres (never through pgagroal) so the pooler's
  # statistics are not polluted by the exporter's own scrape connections.
  pgexporter:
    build:
      context: ./pgexporter
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_BACKEND_HOST: postgres
      PG_BACKEND_PORT: "5432"
      PGEXPORTER_USER: pgexporter
      PGEXPORTER_PASSWORD: pgexporter
      PGEXPORTER_METRICS_PORT: "5002"
      PGEXPORTER_LOG_LEVEL: info
    ports:
      - "5002:5002"   # pgexporter metrics (server metrics)
    networks:
      - pgagroal-net

  test-client:
    image: postgres:17.4-bookworm
    depends_on:
      pgagroal:
        condition: service_healthy
    environment:
      PGPASSWORD: testpass
    command:
      - sh
      - -c
      - |
        psql -h pgagroal -p 6432 -U testuser -d testdb -c 'SELECT 1 AS connection_ok;'
        echo 'Test passed: connection via pgagroal successful'
    networks:
      - pgagroal-net

volumes:
  pg_data:

networks:
  pgagroal-net:
    driver: bridge
